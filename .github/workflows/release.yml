name: Release

on:
  workflow_run:
    workflows: ["CI/CD - Build and Test"]
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_commit.message, '[skip ci]') }}
    outputs:
      release-sha: ${{ steps.get-sha.outputs.sha }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npx semantic-release

      - name: Capture release SHA
        id: get-sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "📌 Release commit SHA: $SHA"

      - name: Release Summary
        if: success()
        run: |
          echo "## 🎉 Release automático completado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Se ha creado un nuevo release automáticamente" >> $GITHUB_STEP_SUMMARY
          echo "✅ CHANGELOG.md actualizado" >> $GITHUB_STEP_SUMMARY
          echo "✅ Badges actualizados en README (versión, tests, coverage)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tag creado en GitHub" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Ver Releases](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
          echo "- [Ver CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: release
    if: ${{ success() }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify deploy commit
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          RELEASE_SHA="${{ needs.release.outputs.release-sha }}"
          echo "📌 Release SHA : $RELEASE_SHA"
          echo "📌 Current HEAD: $CURRENT_SHA"
          if [ "$CURRENT_SHA" != "$RELEASE_SHA" ]; then
            echo "⚠️ WARNING: HEAD ($CURRENT_SHA) differs from release SHA ($RELEASE_SHA)"
            echo "Puede haber un commit posterior al release. Continuando con HEAD."
          else
            echo "✅ HEAD coincide con el commit del release"
          fi

      - name: Deploy API to Render
        run: |
          HOOK_URL="${{ secrets.RENDER_DEPLOY_HOOK_API }}"
          if [ -z "$HOOK_URL" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK_API no está configurado, saltando deploy de API"
            exit 0
          fi
          echo "Triggering API deploy..."
          status_code=$(curl -s -o /dev/null -w "%{http_code}" "$HOOK_URL")
          case "$status_code" in
            2??)
              echo "✅ API deploy triggered"
              ;;
            *)
              echo "❌ API deploy failed (HTTP $status_code)"
              exit 1
              ;;
          esac

      - name: Deploy Frontend to Render
        run: |
          HOOK_URL="${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
          if [ -z "$HOOK_URL" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK_FRONTEND no está configurado, saltando deploy de Frontend"
            exit 0
          fi
          echo "Triggering Frontend deploy..."
          status_code=$(curl -s -o /dev/null -w "%{http_code}" "$HOOK_URL")
          case "$status_code" in
            2??)
              echo "✅ Frontend deploy triggered"
              ;;
            *)
              echo "❌ Frontend deploy failed (HTTP $status_code)"
              exit 1
              ;;
          esac

      - name: Deploy Summary
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "## 🚀 Deploy triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📌 Commit desplegado: \`$CURRENT_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ API: https://istqb-api-free.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontend: https://istqb-frontend-static.onrender.com" >> $GITHUB_STEP_SUMMARY
