services:
  - type: web
    name: istqb-api
    runtime: node
    buildCommand: npm install --production=false && npm run build --workspace=packages/shared && npm run build --workspace=packages/api
    startCommand: npm start --workspace=packages/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3001
    region: oregon
    plan: starter
    autoDeploy: true

  # Frontend as Static Site (FREE - saves $7/month)
  - type: web
    name: istqb-frontend
    runtime: static
    buildCommand: npm install --production=false && npm run build --workspace=packages/shared && npm run build --workspace=packages/web
    staticPublishPath: ./packages/web/out
    envVars:
      - key: NODE_ENV
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    region: oregon
    autoDeploy: true

# Cron job moved to cron-job.org (free external service)
# URL: https://istqb-api-free.onrender.com/api/scheduler/reminders/process
# Schedule: Every 15 minutes (optimizado para reducir tráfico a Supabase)
# Saves: ~$10/month + 83% menos requests a Supabase
